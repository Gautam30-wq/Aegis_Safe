<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — AegisSafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../shared/global-interactivity.css">
  <link rel="icon" href="../rel_icon.png" type="image/x-icon">
</head>

<body>
  <main class="signup-page">
    <div class="signup-card">


      <div class="signup-icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true">
          <path
            d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z"
            stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>

      <h1 class="signup-title" id="signup-title">Emergency Contacts</h1>
      <p class="signup-lede" id="signup-lede">Add two emergency mobile numbers to be notified during SOS.</p>
      <p class="form-feedback" id="form-feedback" aria-live="polite"></p>

      <form class="signup-form" id="signup-form" action="#" method="post" novalidate>
        <div id="dynamic-fields">
          <div class="contacts-grid">
            <label class="field-label" for="contact1">Emergency Contact 1</label>
            <input class="field-input" type="tel" id="contact1" name="contact1" placeholder="+91 98765 43210"
              inputmode="tel" autocomplete="tel">

            <p class="field-hint">Include country code, e.g. +91 for India</p>
          </div>
        </div>
        <button type="submit" class="btn-send-otp" id="primary-button">Save Contacts</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-logo">
        <span class="sparkle">✨</span> AegisSafe
      </div>
      <div class="footer-copy">
        &copy; 2026 AegisSafe. Standing for equality, dignity, and justice.
      </div>
    </div>
  </footer>
  <script src="../shared/script.js" defer></script>
  <script src="script.js" defer></script>
</body>

</html>
